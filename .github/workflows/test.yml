name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout QA Skills source
        uses: actions/checkout@v4
        with:
          repository: naodeng/awesome-qa-skills
          path: test-fixtures/awesome-qa-skills

      - name: Checkout QA Skills website content
        uses: actions/checkout@v4
        with:
          repository: naodeng/naodeng.com.cn
          path: test-fixtures/naodeng.com.cn

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit and E2E tests
        env:
          QA_SKILLS_ROOT: ${{ github.workspace }}/test-fixtures/awesome-qa-skills
          QA_SKILLS_SITE_ROOT: ${{ github.workspace }}/test-fixtures/naodeng.com.cn
        run: npm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
